name: CI

on:
  push:
  pull_request:

jobs:
  deploy-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - name: Tests (Vitest)
        run: npm test
      - name: Build production
        run: npx vite build
        env:
          VITE_CLERK_PUBLISHABLE_KEY: pk_test_ci_placeholder
          VITE_STRIPE_PUBLISHABLE_KEY: pk_test_ci_placeholder
