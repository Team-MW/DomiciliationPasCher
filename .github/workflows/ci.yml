name: CI

on:
  push:
  pull_request:

jobs:
  deploy-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Vérification complète (même contrôle que le hook pre-push)
        run: npm run verify
      - name: Audit des dépendances de production (non bloquant)
        run: npm audit --omit=dev --audit-level=critical || true
